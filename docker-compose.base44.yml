services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=prostock
      - POSTGRES_PASSWORD=prostockpass
      - POSTGRES_DB=prostock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prostock"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads:/app/uploads
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://prostock:prostockpass@db:5432/prostock
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npx next dev -p 3000 -H 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  pgdata:
  uploads:
