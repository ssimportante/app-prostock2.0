services:
  deps:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "test -f node_modules/.package-lock.json && echo 'dependencies cached' || npm install --no-audit --no-fund --legacy-peer-deps"

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - CHOKIDAR_USEPOLLING=true
    command: npx next dev -p 3000 -H 0.0.0.0
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  node_modules:
